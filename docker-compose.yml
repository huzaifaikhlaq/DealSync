
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: dealsync
      POSTGRES_USER: dealsync
      POSTGRES_PASSWORD: local_development_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dealsync_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealsync -d dealsync"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dealsync_pgdata:
